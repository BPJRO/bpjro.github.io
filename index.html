<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BPJRO的个人主页</title>
    <meta name="description" content="BPJRO 的个人主页：关于我、近期情况、文章与联系方式。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BPJRO的个人主页" />
    <meta property="og:description" content="关于我、近期情况、文章与联系方式。" />
    <meta property="og:locale" content="zh_CN" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="alternate" type="application/rss+xml" title="BPJRO RSS" href="feed.xml" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"Person","name":"BPJRO","address":{"@type":"PostalAddress","addressLocality":"上海"},"email":"mailto:bpjro@outlook.com"}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#about">跳到正文</a>
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">BPJRO</span>
        </div>
        <nav class="nav" aria-label="主导航">
          <a href="#about">关于我</a>
          <a href="#updates">近期情况</a>
          <a href="#posts">文章</a>
          <a href="#contact">联系方式</a>
        </nav>
      </div>
    </header>

    <main>
      <!-- 关于我 -->
      <section id="about" class="page-section">
        <div class="container about-layout">
          <div class="about-text">
            <p class="section-kicker">ABOUT</p>
            <h1 class="about-name">BPJRO</h1>
            <p class="about-title muted">被差别民 · 上海</p>
            <p class="about-bio">
              真的有人会看自我介绍吗？
            </p>
          </div>
          <div class="about-avatar">
            <div class="avatar-circle" aria-hidden="true">
              <span class="avatar-initial">B</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 近期情况 -->
      <section id="updates" class="page-section section-alt">
        <div class="container">
          <h2 class="section-title">近期情况</h2>

          <div class="updates-grid">
            <!-- 极简列表 -->
            <div class="card updates-highlights">
              <h3 class="sub-title">最近在做</h3>
              <ul class="highlights-list">
                <!-- 由脚本从数据文件渲染 -->
              </ul>
            </div>

            <!-- 时间线 -->
            <div class="card updates-timeline-card">
              <h3 class="sub-title">时间线</h3>
              <div class="timeline">
                <!-- 由脚本从数据文件渲染 -->
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 最近文章 -->
      <section id="posts" class="page-section">
        <div class="container">
          <div class="section-header-row">
            <h2 class="section-title">最近文章</h2>
            <a href="posts/index.html" class="btn btn-ghost small">
              查看全部
            </a>
          </div>

          <div class="posts-grid" id="posts-grid">
            <!-- 同步渲染（零请求）；noscript 兜底 -->
            <noscript><p class="muted">启用 JavaScript 后可浏览最近文章，或直接前往 <a href="posts/index.html">全部文章</a>。</p></noscript>
          </div>
        </div>
      </section>

      <!-- 联系方式 -->
      <section id="contact" class="page-section section-alt">
        <div class="container">
          <h2 class="section-title">联系方式</h2>
          <div class="contact-grid">
            <div class="card contact-item">
              <div class="contact-label">Mail</div>
              <a href="mailto:bpjro@outlook.com" class="contact-value">
                bpjro@outlook.com
              </a>
            </div>
            <div class="card contact-item">
              <div class="contact-label">GitHub</div>
              <a href="https://github.com/bpjro" class="contact-value" target="_blank" rel="noopener">
                bpjro
              </a>
            </div>
            <div class="card contact-item">
              <div class="contact-label">Zhihu</div>
              <a href="https://www.zhihu.com/people/A-Side" class="contact-value" target="_blank" rel="noopener">
                这里躺着一个人
              </a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p class="muted small-text">
          © <span id="footer-year">2026</span> BPJRO. All rights reserved.
        </p>
      </div>
    </footer>

    <script src="data/site-data.js"></script>
    <script src="assets/js/markdown.js"></script>
    <script src="assets/js/site.js"></script>
    <script>
      (function () {
        if (!window.SITE_DATA) return;
        var profile = window.SITE_DATA.profile,
          recentHighlights = window.SITE_DATA.recentHighlights,
          timelineEvents = window.SITE_DATA.timelineEvents;

        // 关于我
        var nameEl = document.querySelector(".about-name");
        var titleEl = document.querySelector(".about-title");
        var bioEl = document.querySelector(".about-bio");
        var brandNameEl = document.querySelector(".brand-name");
        var avatarInitialEl = document.querySelector(".avatar-initial");
        var avatarCircleEl = document.querySelector(".avatar-circle");

        function getAvatarInitial(name) {
          if (!name) return null;
          var trimmed = name.trim();
          if (!trimmed) return null;
          var firstChar = trimmed.charAt(0);
          if (firstChar >= "\u4e00" && firstChar <= "\u9fff") return firstChar;
          if (/^[A-Za-z]/.test(firstChar)) return trimmed.split(/\s+/)[0].charAt(0).toUpperCase();
          return null;
        }

        if (profile) {
          if (nameEl) nameEl.textContent = profile.name || "你的姓名";
          if (brandNameEl) brandNameEl.textContent = profile.name || "Your Name";
          if (titleEl) titleEl.textContent = (profile.title || "你的当前身份 / 角色") + " · " + (profile.location || "所在城市");
          if (bioEl && profile.bio) bioEl.textContent = profile.bio;
          if (avatarInitialEl && avatarCircleEl) {
            var initial = getAvatarInitial(profile.name);
            if (initial) { avatarCircleEl.classList.remove("avatar-empty"); avatarInitialEl.textContent = initial; }
            else avatarCircleEl.classList.add("avatar-empty");
          }
        }

        var yearEl = document.getElementById("footer-year");
        if (yearEl) yearEl.textContent = new Date().getFullYear().toString();

        // 近期情况：极简列表
        var highlightsList = document.querySelector(".highlights-list");
        if (highlightsList && Array.isArray(recentHighlights)) {
          highlightsList.innerHTML = "";
          recentHighlights.forEach(function (item) {
            var li = document.createElement("li");
            li.textContent = item.text || "";
            highlightsList.appendChild(li);
          });
        }

        // 近期情况：时间线（日期容错排序，非法日期沉底）
        var timelineEl = document.querySelector(".timeline");
        if (timelineEl && Array.isArray(timelineEvents)) {
          timelineEl.innerHTML = "";
          var sorted = timelineEvents.slice().sort(function (a, b) {
            var ta = window.SiteMd.parseDateSafe(a.date), tb = window.SiteMd.parseDateSafe(b.date);
            if (isNaN(ta) && isNaN(tb)) return 0;
            if (isNaN(ta)) return 1;
            if (isNaN(tb)) return -1;
            return tb - ta;
          });
          sorted.forEach(function (event) {
            var item = document.createElement("div");
            item.className = "timeline-item";
            var dot = document.createElement("div");
            dot.className = "timeline-dot";
            dot.setAttribute("aria-hidden", "true");
            var content = document.createElement("div");
            content.className = "timeline-content";
            var dateEl = document.createElement("div");
            dateEl.className = "timeline-date muted";
            dateEl.textContent = event.date || "";
            var textEl = document.createElement("div");
            textEl.className = "timeline-text";
            textEl.textContent = event.text || "";
            content.appendChild(dateEl);
            content.appendChild(textEl);
            item.appendChild(dot);
            item.appendChild(content);
            timelineEl.appendChild(item);
          });
        }

        // 最近文章：site-data.js 已内置元数据，同步渲染零请求；旧数据回退到 fetch
        var postsGrid = document.getElementById("posts-grid");
        if (!postsGrid) return;
        function renderTop(postsData) {
          postsGrid.innerHTML = "";
          postsData.slice(0, 3).forEach(function (post) {
            postsGrid.appendChild(window.SitePosts.postCard(post, "posts/post.html?slug=", "h3"));
          });
        }
        var sync = window.SitePosts.getSortedPostsSync();
        if (sync) renderTop(sync);
        else window.SitePosts.loadPostsMeta("posts/md/").then(renderTop);
      })();
    </script>
  </body>
</html>
