<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>🤗BPJRO的个人主页·续</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand">
          <span class="brand-mark"></span>
          <span class="brand-name">BPJRO</span>
        </div>
        <nav class="nav">
          <a href="#about">关于我</a>
          <a href="#updates">近期情况</a>
          <a href="#posts">文章</a>
          <a href="#contact">联系方式</a>
        </nav>
      </div>
    </header>

    <main>
      <!-- 关于我 -->
      <section id="about" class="page-section">
        <div class="container about-layout">
          <div class="about-text">
            <p class="section-kicker">ABOUT</p>
            <h1 class="about-name">BPJRO</h1>
            <p class="about-title muted">被差别民 · 上海</p>
            <p class="about-bio">
              真的有人会看自我介绍吗？
            </p>
          </div>
          <div class="about-avatar">
            <div class="avatar-circle">
              <span class="avatar-initial">Y</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 近期情况 -->
      <section id="updates" class="page-section section-alt">
        <div class="container">
          <h2 class="section-title">近期情况</h2>

          <div class="updates-grid">
            <!-- 极简列表 -->
            <div class="card updates-highlights">
              <h3 class="sub-title">最近在做</h3>
              <ul class="highlights-list">
                <!-- 由脚本从数据文件渲染 -->
              </ul>
            </div>

            <!-- 时间线 -->
            <div class="card updates-timeline-card">
              <h3 class="sub-title">时间线</h3>
              <div class="timeline">
                <!-- 由脚本从数据文件渲染 -->
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 最近文章 -->
      <section id="posts" class="page-section">
        <div class="container">
          <div class="section-header-row">
            <h2 class="section-title">最近文章</h2>
            <a href="posts/index.html" class="btn btn-ghost small">
              查看全部
            </a>
          </div>

          <div class="posts-grid" id="posts-grid">
            <!-- 由脚本从 md 文件 front matter 自动渲染 -->
          </div>
        </div>
      </section>

      <!-- 联系方式 -->
      <section id="contact" class="page-section section-alt">
        <div class="container">
          <h2 class="section-title">联系方式</h2>
          <div class="contact-grid">
            <div class="card contact-item">
              <div class="contact-label">Mail</div>
              <a href="mailto:bpjro@outlook.com" class="contact-value">
                bpjro@outlook.com
              </a>
            </div>
            <div class="card contact-item">
              <div class="contact-label">GitHub</div>
              <a href="https://github.com/bpjro" class="contact-value">
                bpjro
              </a>
            </div>
            <div class="card contact-item">
              <div class="contact-label">Zhihu</div>
              <a href="https://www.zhihu.com/people/A-Side" class="contact-value">
                这里躺着一个人
              </a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p class="muted small-text">
          © <span id="footer-year">2026</span> BPJRO. All rights reserved.
        </p>
      </div>
    </footer>

    <script src="data/site-data.js"></script>
    <script>
      (function () {
        if (!window.SITE_DATA) return;
        const { profile, recentHighlights, timelineEvents, posts } =
          window.SITE_DATA;

        // 关于我
        const nameEl = document.querySelector(".about-name");
        const titleEl = document.querySelector(".about-title");
        const bioEl = document.querySelector(".about-bio");
        const brandNameEl = document.querySelector(".brand-name");
        const avatarInitialEl = document.querySelector(".avatar-initial");
        const avatarCircleEl = document.querySelector(".avatar-circle");

        function getAvatarInitial(name) {
          if (!name) return null;
          const trimmed = name.trim();
          if (!trimmed) return null;
          const firstChar = trimmed.charAt(0);
          // 简单判断：如果是中文字符区间，直接用首汉字
          if (firstChar >= "\u4e00" && firstChar <= "\u9fff") {
            return firstChar;
          }
          // 如果是英文字母，用第一个单词的首字母
          if (/^[A-Za-z]/.test(firstChar)) {
            const firstWord = trimmed.split(/\s+/)[0];
            return firstWord.charAt(0).toUpperCase();
          }
          // 其他情况不显示字母，交给占位图标
          return null;
        }

        if (profile) {
          if (nameEl) nameEl.textContent = profile.name || "你的姓名";
          if (brandNameEl) brandNameEl.textContent = profile.name || "Your Name";
          if (titleEl) {
            const title = profile.title || "你的当前身份 / 角色";
            const location = profile.location || "所在城市";
            titleEl.textContent = `${title} · ${location}`;
          }
          if (bioEl && profile.bio) {
            bioEl.textContent = profile.bio;
          }

          if (avatarInitialEl && avatarCircleEl) {
            const initial = getAvatarInitial(profile.name);
            if (initial) {
              avatarCircleEl.classList.remove("avatar-empty");
              avatarInitialEl.textContent = initial;
            } else {
              avatarCircleEl.classList.add("avatar-empty");
            }
          }
        }

        // 页脚年份
        const yearEl = document.getElementById("footer-year");
        if (yearEl) {
          yearEl.textContent = new Date().getFullYear().toString();
        }

        // 近期情况：极简列表
        const highlightsList = document.querySelector(".highlights-list");
        if (highlightsList && Array.isArray(recentHighlights)) {
          highlightsList.innerHTML = "";
          recentHighlights.forEach((item) => {
            const li = document.createElement("li");
            li.textContent = item.text || "";
            highlightsList.appendChild(li);
          });
        }

        // 近期情况：时间线
        const timelineEl = document.querySelector(".timeline");
        if (timelineEl && Array.isArray(timelineEvents)) {
          timelineEl.innerHTML = "";
          timelineEvents.forEach((event) => {
            const item = document.createElement("div");
            item.className = "timeline-item";

            const dot = document.createElement("div");
            dot.className = "timeline-dot";

            const content = document.createElement("div");
            content.className = "timeline-content";

            const dateEl = document.createElement("div");
            dateEl.className = "timeline-date muted";
            dateEl.textContent = event.date || "";

            const textEl = document.createElement("div");
            textEl.className = "timeline-text";
            textEl.textContent = event.text || "";

            content.appendChild(dateEl);
            content.appendChild(textEl);
            item.appendChild(dot);
            item.appendChild(content);
            timelineEl.appendChild(item);
          });
        }

        // 最近文章：从 md 文件 front matter 自动读取
        var postsGrid = document.getElementById("posts-grid");
        var slugs = Array.isArray(posts) ? posts : [];
        if (postsGrid && slugs.length > 0) {
          function parseFrontMatter(text) {
            var result = { meta: {}, body: text };
            var match = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
            if (!match) return result;
            for (var i = 0; i < match[1].split(/\r?\n/).length; i++) {
              var line = match[1].split(/\r?\n/)[i];
              var idx = line.indexOf(":");
              if (idx === -1) continue;
              var key = line.slice(0, idx).trim();
              var val = line.slice(idx + 1).trim();
              if (key) result.meta[key] = val;
            }
            result.body = text.slice(match[0].length);
            return result;
          }

          Promise.all(
            slugs.map(function (slug) {
              return fetch("posts/md/" + slug + ".md")
                .then(function (res) { return res.ok ? res.text() : ""; })
                .then(function (text) {
                  if (!text) return null;
                  var m = parseFrontMatter(text);
                  return { slug: slug, title: m.meta.title || slug, date: m.meta.date || "", summary: m.meta.summary || "" };
                })
                .catch(function () { return null; });
            })
          ).then(function (results) {
            var postsData = results.filter(Boolean).sort(function (a, b) {
              return new Date(b.date) - new Date(a.date);
            });
            postsGrid.innerHTML = "";
            postsData.slice(0, 3).forEach(function (post) {
              var article = document.createElement("article");
              article.className = "card post-card";

              var dateDiv = document.createElement("div");
              dateDiv.className = "post-date muted";
              dateDiv.textContent = post.date;

              var titleH3 = document.createElement("h3");
              titleH3.className = "post-title";
              titleH3.textContent = post.title;

              var summaryP = document.createElement("p");
              summaryP.className = "post-summary";
              summaryP.textContent = post.summary || "这篇文章暂时没有摘要描述。";

              var linkA = document.createElement("a");
              linkA.className = "post-link";
              linkA.textContent = "阅读更多";
              linkA.href = "posts/post.html?slug=" + encodeURIComponent(post.slug);

              article.appendChild(dateDiv);
              article.appendChild(titleH3);
              article.appendChild(summaryP);
              article.appendChild(linkA);
              postsGrid.appendChild(article);
            });
          });
        }
      })();
    </script>
  </body>
</html>
