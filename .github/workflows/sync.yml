name: sync-meta
on:
  push:
    branches: [main, master]
    paths: ['posts/md/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/site-data.js feed.xml sitemap.xml
          git diff --cached --quiet || git commit -m "chore: sync posts meta"
          git push
