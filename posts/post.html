<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文章 - BPJRO的个人主页</title>
    <meta name="description" content="BPJRO 个人主页文章详情" />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#post-content">跳到正文</a>
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <a href="../index.html" class="brand-name">BPJRO</a>
        </div>
        <nav class="nav" aria-label="主导航">
          <a href="../index.html#about">关于我</a>
          <a href="../index.html#updates">近期情况</a>
          <a href="../index.html#posts">文章</a>
          <a href="../index.html#contact">联系方式</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-section">
        <div class="container">
          <article class="card">
            <p id="post-date" class="post-date muted"></p>
            <h1 id="post-title" class="post-title">文章标题</h1>
            <div id="post-content" class="post-body"></div>
            <noscript><p class="muted">此页需要启用 JavaScript 才能加载 Markdown 文章正文。</p></noscript>

            <div class="post-actions">
              <a href="../index.html" class="btn btn-ghost small"> 返回主页 </a>
              <a href="index.html" class="btn btn-ghost small"> 返回文章列表 </a>
            </div>
          </article>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p class="muted small-text">
          © <span id="footer-year">2026</span> BPJRO. All rights reserved.
        </p>
      </div>
    </footer>

    <script src="../assets/js/markdown.js"></script>
    <script>
      (function () {
        var yearEl = document.getElementById("footer-year");
        if (yearEl) yearEl.textContent = new Date().getFullYear().toString();

        function getQueryParam(name) {
          try { return new URLSearchParams(window.location.search).get(name); }
          catch (e) { return null; }
        }

        function loadPost() {
          var slug = (getQueryParam("slug") || "").trim();
          // 仅允许字母数字/_/-，防路径穿越
          if (slug && !/^[A-Za-z0-9_-]+$/.test(slug)) slug = "";
          var titleEl = document.getElementById("post-title");
          var dateEl = document.getElementById("post-date");
          var contentEl = document.getElementById("post-content");

          if (!slug) {
            if (titleEl) titleEl.textContent = "未找到对应文章";
            if (dateEl) dateEl.textContent = "";
            if (contentEl) contentEl.innerHTML = "<p class='muted'>请检查链接是否正确，或稍后再试。</p>";
            return;
          }

          fetch("md/" + slug + ".md")
            .then(function (res) { return res.ok ? res.text() : ""; })
            .then(function (md) {
              if (!contentEl) return;
              if (!md) {
                titleEl.textContent = "未找到对应文章";
                contentEl.innerHTML = "<p class='muted'>文章内容尚未准备好，请稍后再试。</p>";
                return;
              }
              var parsed = window.SiteMd.parseFrontMatter(md);
              var meta = parsed.meta, body = parsed.body;
              if (titleEl) titleEl.textContent = meta.title || slug;
              if (dateEl) dateEl.textContent = meta.date || "";
              document.title = (meta.title || "文章") + " - BPJRO的个人主页";
              contentEl.innerHTML = window.SiteMd.markdownToHtml(body);
            })
            .catch(function () {
              if (!contentEl) return;
              contentEl.innerHTML = "<p class='muted'>加载文章内容时出现问题，请稍后再试。</p>";
            });
        }

        loadPost();
      })();
    </script>
  </body>
</html>
