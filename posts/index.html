<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>全部文章 - BPJRO的个人主页</title>
    <meta name="description" content="BPJRO 的全部文章列表。" />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="alternate" type="application/rss+xml" title="BPJRO RSS" href="../feed.xml" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#posts-list">跳到文章列表</a>
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <a href="../index.html" class="brand-name">BPJRO</a>
        </div>
        <nav class="nav" aria-label="主导航">
          <a href="../index.html#about">关于我</a>
          <a href="../index.html#updates">近期情况</a>
          <a href="../index.html#posts">文章</a>
          <a href="../index.html#contact">联系方式</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-section">
        <div class="container">
          <div class="section-header-row">
            <h1 class="section-title">全部文章</h1>
            <a href="../index.html" class="btn btn-ghost small"> 返回主页 </a>
          </div>

          <div id="posts-list" class="posts-grid">
            <noscript><p class="muted">启用 JavaScript 后可浏览文章列表。</p></noscript>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p class="muted small-text">
          © <span id="footer-year">2026</span> BPJRO. All rights reserved.
        </p>
      </div>
    </footer>

    <script src="../data/site-data.js"></script>
    <script src="../assets/js/markdown.js"></script>
    <script src="../assets/js/site.js"></script>
    <script>
      (function () {
        var yearEl = document.getElementById("footer-year");
        if (yearEl) yearEl.textContent = new Date().getFullYear().toString();

        var listEl = document.getElementById("posts-list");
        if (!listEl) return;
        function render(posts) {
          listEl.innerHTML = "";
          posts.forEach(function (post) {
            listEl.appendChild(window.SitePosts.postCard(post, "post.html?slug=", "h2"));
          });
        }
        var sync = window.SitePosts.getSortedPostsSync();
        if (sync) render(sync);
        else window.SitePosts.loadPostsMeta("md/").then(render);
      })();
    </script>
  </body>
</html>
