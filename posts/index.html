<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>全部文章 - 🤗BPJRO的个人主页·续</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand">
          <span class="brand-mark"></span>
          <a href="../index.html" class="brand-name">BPJRO</a>
        </div>
        <nav class="nav">
          <a href="../index.html#about">关于我</a>
          <a href="../index.html#updates">近期情况</a>
          <a href="../index.html#posts">文章</a>
          <a href="../index.html#contact">联系方式</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-section">
        <div class="container">
          <div class="section-header-row">
            <h1 class="section-title">全部文章</h1>
            <a href="../index.html" class="btn btn-ghost small"> 返回主页 </a>
          </div>

          <div id="posts-list" class="posts-grid">
            <!-- 将由脚本从数据文件渲染 -->
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p class="muted small-text">
          © <span id="footer-year">2026</span> BPJRO. All rights reserved.
        </p>
      </div>
    </footer>

    <script src="../data/site-data.js"></script>
    <script>
      (function () {
        const yearEl = document.getElementById("footer-year");
        if (yearEl) {
          yearEl.textContent = new Date().getFullYear().toString();
        }

        function parseFrontMatter(text) {
          const result = { meta: {}, body: text };
          const match = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
          if (!match) return result;
          for (const line of match[1].split(/\r?\n/)) {
            const idx = line.indexOf(":");
            if (idx === -1) continue;
            const key = line.slice(0, idx).trim();
            const val = line.slice(idx + 1).trim();
            if (key) result.meta[key] = val;
          }
          result.body = text.slice(match[0].length);
          return result;
        }

        const listEl = document.getElementById("posts-list");
        const slugs = window.SITE_DATA && Array.isArray(window.SITE_DATA.posts)
          ? window.SITE_DATA.posts
          : [];

        if (!listEl || slugs.length === 0) return;

        Promise.all(
          slugs.map(function (slug) {
            return fetch("md/" + slug + ".md")
              .then(function (res) { return res.ok ? res.text() : ""; })
              .then(function (text) {
                if (!text) return null;
                var m = parseFrontMatter(text);
                return { slug: slug, title: m.meta.title || slug, date: m.meta.date || "", summary: m.meta.summary || "" };
              })
              .catch(function () { return null; });
          })
        ).then(function (results) {
          var posts = results.filter(Boolean).sort(function (a, b) {
            return new Date(b.date) - new Date(a.date);
          });
          posts.forEach(function (post) {
            var article = document.createElement("article");
            article.className = "card post-card";

            var dateDiv = document.createElement("div");
            dateDiv.className = "post-date muted";
            dateDiv.textContent = post.date;

            var titleH2 = document.createElement("h2");
            titleH2.className = "post-title";
            titleH2.textContent = post.title;

            var summaryP = document.createElement("p");
            summaryP.className = "post-summary";
            summaryP.textContent = post.summary || "这篇文章暂时没有摘要描述。";

            var linkA = document.createElement("a");
            linkA.className = "post-link";
            linkA.textContent = "阅读更多";
            linkA.href = "post.html?slug=" + encodeURIComponent(post.slug);

            article.appendChild(dateDiv);
            article.appendChild(titleH2);
            article.appendChild(summaryP);
            article.appendChild(linkA);
            listEl.appendChild(article);
          });
        });
      })();
    </script>
  </body>
</html>
